name: Build Lexi26 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Verify APK signature, alignment, and package metadata
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          $ANDROID_HOME/build-tools/35.0.0/zipalign -c -v 4 "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK"

      # Upload immediately after build/verification so emulator failures never block APK delivery.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lexi26-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Install and launch on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.lexi26.app/.MainActivity
            sleep 5
            adb shell dumpsys activity activities | grep -q 'com.lexi26.app'
