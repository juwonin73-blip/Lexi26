name: Build Lexi26 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, v2-rebuild ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Verify APK and launcher metadata
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          $ANDROID_HOME/build-tools/35.0.0/zipalign -c -v 4 "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | tee apk-metadata.txt
          $ANDROID_HOME/build-tools/35.0.0/aapt dump xmltree "$APK" AndroidManifest.xml > manifest-tree.txt
          grep -q 'com.lexi26.app.MainActivityV2' manifest-tree.txt
      - name: Upload APK and metadata
        uses: actions/upload-artifact@v4
        with:
          name: Lexi26-v2-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-metadata.txt
            manifest-tree.txt
          if-no-files-found: error
          retention-days: 30

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Lexi26-v2-debug-apk
          path: test-apk
      - name: Install and launch v2 on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          disable-animations: true
          script: |
            set -o pipefail
            mkdir -p diagnostics
            adb devices -l | tee diagnostics/devices.txt
            adb install -r test-apk/app/build/outputs/apk/debug/app-debug.apk 2>&1 | tee diagnostics/install.txt
            adb shell am start -n com.lexi26.app/.MainActivityV2 2>&1 | tee diagnostics/launch.txt
            sleep 5
            adb shell dumpsys activity activities > diagnostics/activity.txt
            grep -q 'com.lexi26.app' diagnostics/activity.txt
      - name: Collect diagnostics after success or failure
        if: always()
        run: |
          mkdir -p diagnostics
          adb devices -l > diagnostics/devices-after.txt 2>&1 || true
          adb -s emulator-5554 logcat -d -t 3000 > diagnostics/logcat.txt 2>&1 || true
          adb -s emulator-5554 shell dumpsys package com.lexi26.app > diagnostics/package.txt 2>&1 || true
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lexi26-v2-install-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14
